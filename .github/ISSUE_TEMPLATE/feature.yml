name: Nueva feature
description: Propuesta de feature (luego se convierte en specs/03-features/NNN-*/spec.md)
title: "F-NNN: "
labels: [feature, spec]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema / contexto
      description: ¿Qué pasa hoy y a quién afecta (A1 reclutador, A2 hiring manager, A3 comunidad, A4 Javi)?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Objetivo
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requisitos relacionados
      placeholder: FR-010, NFR-001
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options: [Must, Should, Could]
  - type: textarea
    id: notes
    attributes:
      label: Notas
