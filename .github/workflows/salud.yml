# Dispara la comprobacion programada del sitio.
#
# POR QUE AQUI Y NO EN VERCEL: el bloque `schedules` de vercel.json esta escrito y puede
# que funcione, pero nunca aparecio en el panel y no se pudo verificar que dispare solo.
# Schedules y Services estan los dos en beta. Esto no depende de ninguna de las dos.
#
# DOS LIMITES QUE HAY QUE CONOCER:
#
# 1. En un repositorio publico, GitHub DESACTIVA las tareas programadas tras 60 dias sin
#    actividad en el repositorio. Y la ejecucion de esta tarea no cuenta como actividad.
#    O sea que justo lo que esto protege -sobrevivir a la inactividad- tiene fecha de
#    caducidad. La red de abajo: el proveedor de datos avisa por correo una semana antes
#    de suspender el proyecto, y restaurarlo es un clic.
# 2. Las tareas programadas se retrasan cuando GitHub esta cargado, y bajo carga alta
#    algunas se descartan. Por eso corre en el minuto 17 y no en punto, que es cuando se
#    congestiona, y por eso el intervalo es de seis horas y no de veinticuatro: cuatro
#    oportunidades al dia aguantan que se pierda alguna.
#
# QUE HAY QUE CONFIGURAR EN EL REPOSITORIO, una sola vez:
#   Settings - Secrets and variables - Actions
#     Variable  URL_SALUD     la direccion completa del endpoint
#     Secreto   CRON_SECRET   el mismo valor que esta en Vercel
#
# Las tareas programadas solo corren desde la rama por defecto. Hasta que esto llegue a
# main, no se dispara solo.

name: Comprobacion de salud

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a la comprobacion
        env:
          URL: ${{ vars.URL_SALUD }}
          SECRETO: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRETO" ]; then
            echo "Falta la variable URL_SALUD o el secreto CRON_SECRET en este repositorio."
            echo "Se configuran en Settings - Secrets and variables - Actions."
            exit 1
          fi

          codigo=$(curl -s -o cuerpo.txt -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $SECRETO" \
            --max-time 30 --retry 2 --retry-delay 5 "$URL")

          echo "La comprobacion respondio $codigo"

          if [ "$codigo" != "204" ]; then
            echo "--- cuerpo de la respuesta, por si dice algo util:"
            cat cuerpo.txt || true
            echo
            echo "Fallo. Si es 401, el secreto de aqui y el de Vercel no coinciden."
            echo "Si es 500, la comprobacion llego pero algo fallo dentro: mira el correo."
            exit 1
          fi
