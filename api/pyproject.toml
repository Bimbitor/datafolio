[project]
name = "datafolio-api"
version = "0.1.0"
description = "API de Datafolio: la unica puerta de escritura del sitio"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162.0"]

[project.optional-dependencies]
# httpx2 solo lo necesita el TestClient de FastAPI, y es el nombre que pide esta version de
# starlette, no `httpx`. Es de desarrollo: no viaja en la funcion desplegada, y vale la pena
# porque la puerta del secreto se prueba por HTTP de verdad y no contra un objeto de mentira.
dev = ["pytest>=9.2.0", "httpx2>=2.16.0"]

# Esto no es una biblioteca que se publique: Vercel ejecuta los archivos tal cual. Sin esta
# linea, setuptools intenta adivinar que empaquetar y se detiene al ver tres modulos sueltos.
[tool.setuptools]
py-modules = []

# `pythonpath` deja importar `main` desde las pruebas sin instalar el paquete ni inventar
# una carpeta de codigo fuente. Es relativo a este archivo, que es la raiz del servicio.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Vercel carga la variable `app` del modulo `main`. El runtime de Python ejecuta
# aplicaciones ASGI tal cual, sin adaptador. Ver specs/001-sitio-base/research.md, D-02.
[tool.vercel]
entrypoint = "main:app"
